<!doctype html>
<!-- Ảnh bìa Fanpage TomCaShop — Phương án B "Đối xứng giữa" (Mẫu A). Khung 1640×624.
     Vùng an toàn chữ: x 220–1420 (1200px giữa). Mọi chữ kết thúc trước y≈420: dải dưới để trống vì ảnh đại diện che góc dưới trái (điện thoại che tới y≈427).
     Mở qua máy chủ http (để tải font), chụp đúng phần tử #bia. -->
<html lang="vi"><head><meta charset="utf-8"><title>Ảnh bìa B</title>
<link rel="stylesheet" href="font/400.css"><link rel="stylesheet" href="font/600.css">
<link rel="stylesheet" href="font/700.css"><link rel="stylesheet" href="font/800.css">
<style>
*{box-sizing:border-box;margin:0}
body{background:#fff;font-family:'Be Vietnam Pro',sans-serif}
#bia{position:relative;width:1640px;height:624px;overflow:hidden;background:#EEF7FD}
.dom{position:absolute;border-radius:50%}
.song{position:absolute;left:0;width:100%}
.giua{position:absolute;left:220px;width:1200px;top:66px;text-align:center}
h1{font-weight:800;font-size:124px;line-height:1;letter-spacing:-2px}
h1 .x{color:#1F74B4}h1 .h{color:#E85A8B}
.mo{margin-top:20px;font-size:38px;font-weight:600;color:#164C75}
.the{position:absolute;left:50%;transform:translateX(-50%);top:330px;background:#fff;border-radius:999px;
  box-shadow:0 8px 28px rgba(31,116,180,.16);display:flex;align-items:center;padding:18px 32px;gap:20px;white-space:nowrap}
.the b{font-size:26px;font-weight:700;color:#185F95;display:flex;align-items:center;gap:12px}
.the b.h{color:#C93D6E}
.the i{width:10px;height:10px;border-radius:50%;background:#F27AA3;display:block}
.the svg{width:34px;height:34px}
</style></head><body>
<div id="bia">
  <!-- mảng nền -->
  <div class="dom" style="left:-120px;top:-160px;width:520px;height:520px;background:#D6ECFA"></div>

  <div class="the">
    <b><svg viewBox="0 0 24 24" fill="none" stroke="#1F74B4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>Thanh toán COD</b><i></i>
    <b><svg viewBox="0 0 24 24" fill="none" stroke="#1F74B4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Được kiểm tra hàng</b><i></i>
    <b class="h"><svg viewBox="0 0 24 24" fill="none" stroke="#C93D6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 10h5l3 3v3h-8"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Miễn phí ship từ 2 sản phẩm</b>
